<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Oshare批發｜LINE 綁定</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg: #ded2c6;
      --card: #fff;
      --text: #674b39;
      --muted: #7a6b5c;
      --btn: #d8ccbe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 20px 40px;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 8px 24px rgba(103, 75, 57, 0.12);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }
    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(103, 75, 57, 0.35);
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 16px;
    }
    .meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 16px;
      word-break: break-all;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--btn);
      color: var(--text);
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 14px;
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.ok { color: #1b7a3d; }
    .msg.err { color: #b00020; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">綁定 LINE 通知</h1>
    <p class="sub" id="subText">請填寫手機號碼。若已在 App 申請過會綁到原資料；尚未申請則會先建立一筆並綁定 LINE。</p>

    <div class="meta" id="statusLine">正在連接 LINE…</div>

    <div id="bindForm">
      <label for="phone">手機號碼</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0912345678" />
      <button id="submitBtn" type="button" disabled>確認綁定</button>
    </div>

    <div class="msg" id="message"></div>
    <button id="closeBtn" type="button" class="hidden" style="margin-top: 12px;">關閉並返回對話</button>
  </div>

  <script>
    const LIFF_ID = "2012259104-NgsuVQMO";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyX0Aqq39sml4dIoYl3q9hsR_-SHkH-7wBQe_E3m-3XgMGAaFqpUu2KyT3IEXrnveEe0w/exec";
    const SECRET_TOKEN = "oshare-reg-2026-k9m2x7";

    const statusLine = document.getElementById("statusLine");
    const phoneInput = document.getElementById("phone");
    const submitBtn = document.getElementById("submitBtn");
    const messageEl = document.getElementById("message");
    const bindForm = document.getElementById("bindForm");
    const closeBtn = document.getElementById("closeBtn");
    const titleEl = document.getElementById("title");
    const subText = document.getElementById("subText");

    let lineUserId = "";

    function setMessage(text, type) {
      messageEl.textContent = text || "";
      messageEl.className = "msg" + (type ? " " + type : "");
    }

    function normalizePhone(phone) {
      return String(phone || "").replace(/\D/g, "");
    }

    function isValidPhone(phone) {
      const digits = normalizePhone(phone);
      // 台灣常見：09 開頭 10 碼；也接受 08/07 等 9～10 碼數字
      return /^09\d{8}$/.test(digits) || /^\d{9,10}$/.test(digits);
    }

    function showAlreadyBound(phone) {
      titleEl.textContent = "已綁定";
      subText.textContent = "此 LINE 已完成綁定，審核通過後可用 LINE 通知您。";
      bindForm.classList.add("hidden");
      statusLine.textContent = phone ? ("手機：" + phone) : "已綁定完成";
      setMessage("狀態：已綁定", "ok");
      closeBtn.classList.remove("hidden");
    }

    function showBindSuccess(created) {
      titleEl.textContent = "綁定成功";
      subText.textContent = created
        ? "已建立資料並綁定。請再至 App 用同一手機號碼完成註冊申請。"
        : "綁定完成，審核通過後可用 LINE 通知您。";
      bindForm.classList.add("hidden");
      setMessage("", "");
      closeBtn.classList.remove("hidden");
      setTimeout(function () {
        if (liff.isInClient()) liff.closeWindow();
      }, 1800);
    }

    async function postAction(payload) {
      const res = await fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: "follow",
      });
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (_) {
        throw new Error("伺服器回應異常，請確認 Apps Script 已部署最新版本。");
      }
    }

    async function checkExistingBind() {
      statusLine.textContent = "檢查綁定狀態…";
      const data = await postAction({
        action: "lookupLine",
        token: SECRET_TOKEN,
        lineUserId: lineUserId,
      });
      if (data.ok && data.bound) {
        showAlreadyBound(data.phone || "");
        return true;
      }
      return false;
    }

    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        lineUserId = profile.userId || "";
        const display = profile.displayName || "";

        if (!lineUserId) {
          statusLine.textContent = "無法取得 LINE 身分";
          setMessage("請用 LINE App 開啟此頁。", "err");
          return;
        }

        const already = await checkExistingBind();
        if (already) return;

        statusLine.textContent = display ? ("已連接 LINE：" + display) : "已取得 LINE 身分";
        submitBtn.disabled = false;
      } catch (err) {
        statusLine.textContent = "LINE 連接失敗";
        setMessage(String(err && err.message ? err.message : err), "err");
      }
    }

    async function bind() {
      setMessage("");
      const phone = (phoneInput.value || "").trim();
      if (!phone) {
        setMessage("請輸入手機號碼。", "err");
        return;
      }
      if (!isValidPhone(phone)) {
        setMessage("手機號碼格式不正確，請輸入如 0912345678。", "err");
        return;
      }
      if (!lineUserId) {
        setMessage("尚未取得 LINE userId。", "err");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "綁定中…";

      try {
        const data = await postAction({
          action: "bindLine",
          token: SECRET_TOKEN,
          phone: normalizePhone(phone),
          lineUserId: lineUserId,
        });

        if (data.ok) {
          showBindSuccess(!!data.created);
          return;
        }

        if (data.error === "unauthorized") {
          setMessage("驗證失敗，請聯繫管理員。", "err");
        } else {
          setMessage("綁定失敗：" + (data.error || "未知錯誤"), "err");
        }
        submitBtn.disabled = false;
        submitBtn.textContent = "確認綁定";
      } catch (err) {
        setMessage(String(err && err.message ? err.message : err), "err");
        submitBtn.disabled = false;
        submitBtn.textContent = "確認綁定";
      }
    }

    closeBtn.addEventListener("click", function () {
      if (typeof liff !== "undefined" && liff.isInClient()) {
        liff.closeWindow();
      }
    });
    submitBtn.addEventListener("click", bind);
    initLiff();
  </script>
</body>
</html>
