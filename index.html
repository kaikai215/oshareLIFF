<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Oshare批發｜LINE 綁定</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --bg: #ded2c6;
      --card: #fff;
      --text: #674b39;
      --muted: #7a6b5c;
      --btn: #d8ccbe;
      --line: #06c755;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 20px 40px;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 8px 24px rgba(103, 75, 57, 0.12);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }
    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(103, 75, 57, 0.35);
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 16px;
    }
    .meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 16px;
      word-break: break-all;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--btn);
      color: var(--text);
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .msg {
      margin-top: 14px;
      font-size: 0.9rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.ok { color: #1b7a3d; }
    .msg.err { color: #b00020; }
    .hint {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>綁定 LINE 通知</h1>
    <p class="sub">請填寫的 Email，綁定後審核通過即可用 LINE 通知您。</p>

    <div class="meta" id="statusLine">正在連接 LINE…</div>

    <label for="email">申請 Email</label>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" />

    <button id="submitBtn" type="button" disabled>確認綁定</button>
    <div class="msg" id="message"></div>
    <p class="hint">請確認 Email 是否與申請時相同。</p>
  </div>

  <script>
    /**
     * ========== 請改這三個設定 ==========
     * 1) LIFF_ID：LINE Developers → LIFF → LIFF ID
     * 2) WEB_APP_URL：與註冊申請相同的 Apps Script /exec 網址
     * 3) SECRET_TOKEN：與 Apps Script 的 SECRET_TOKEN 相同
     */
    const LIFF_ID = "2012259104-NgsuVQMO";
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyX0Aqq39sml4dIoYl3q9hsR_-SHkH-7wBQe_E3m-3XgMGAaFqpUu2KyT3IEXrnveEe0w/exec";
    const SECRET_TOKEN = "oshare-reg-2026-k9m2x7";

    const statusLine = document.getElementById("statusLine");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submitBtn");
    const messageEl = document.getElementById("message");

    let lineUserId = "";

    function setMessage(text, type) {
      messageEl.textContent = text || "";
      messageEl.className = "msg" + (type ? " " + type : "");
    }

    async function initLiff() {
      try {
        if (!LIFF_ID || LIFF_ID.includes("請填")) {
          statusLine.textContent = "";
          setMessage("", "err");
          return;
        }

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        lineUserId = profile.userId || "";
        const display = profile.displayName || "";
        statusLine.textContent = display
          ? "已連接 LINE：" + display
          : "已取得 LINE 身分";
        submitBtn.disabled = !lineUserId;
        if (!lineUserId) {
          setMessage("無法取得 LINE userId，請用 LINE App 開啟此頁。", "err");
        }
      } catch (err) {
        statusLine.textContent = "LINE 連接失敗";
        setMessage(String(err && err.message ? err.message : err), "err");
      }
    }

    async function bind() {
      setMessage("");
      const email = (emailInput.value || "").trim();
      if (!email) {
        setMessage("請輸入申請時的 Email。", "err");
        return;
      }
      if (!lineUserId) {
        setMessage("尚未取得 LINE userId。", "err");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "綁定中…";

      const payload = {
        action: "bindLine",
        token: SECRET_TOKEN,
        email: email,
        lineUserId: lineUserId,
      };

      try {
        // text/plain 可避免部分瀏覽器對 Apps Script 的 CORS 預檢問題
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          redirect: "follow",
        });
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (_) {
          throw new Error("");
        }

        if (data.ok) {
          setMessage(
            "綁定成功！\n姓名：" + (data.name || "—") +
            "\n之後審核通過可用 LINE 通知您。",
            "ok"
          );
          submitBtn.textContent = "已綁定";
          return;
        }

        if (data.error === "not_found") {
          setMessage("找不到此 Email 的申請資料，請或確認 Email 是否正確。", "err");
        } else if (data.error === "unauthorized") {
          setMessage("驗證失敗，請聯繫管理員。", "err");
        } else {
          setMessage("綁定失敗：" + (data.error || "未知錯誤"), "err");
        }
        submitBtn.disabled = false;
        submitBtn.textContent = "確認綁定";
      } catch (err) {
        setMessage(String(err && err.message ? err.message : err), "err");
        submitBtn.disabled = false;
        submitBtn.textContent = "確認綁定";
      }
    }

    submitBtn.addEventListener("click", bind);
    initLiff();
  </script>
</body>
</html>
